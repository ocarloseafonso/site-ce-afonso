<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2640;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  <!-- Left panel: Checklist report document -->
  <rect x="80" y="80" width="480" height="515" rx="20" fill="#131f33" stroke="#1e3a5f" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="80" y="80" width="480" height="56" rx="20" fill="#1a3050"/>
  <rect x="80" y="114" width="480" height="22" fill="#1a3050"/>
  <circle cx="108" cy="108" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="130" cy="108" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="152" cy="108" r="7" fill="#22c55e" opacity="0.8"/>
  <text x="310" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4a9eff">Relatorio de Auditoria - C.E. Afonso</text>
  <text x="110" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9ab5d0" letter-spacing="2">GOOGLE MEU NEGOCIO</text>
  <line x1="110" y1="172" x2="540" y2="172" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Check OK -->
  <rect x="110" y="184" width="430" height="42" rx="8" fill="#0d2d1a"/>
  <circle cx="135" cy="205" r="13" fill="#22c55e"/>
  <path d="M128 205 L133 211 L142 199" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="202" font-family="Arial, sans-serif" font-size="14" fill="#d1fae5">Ficha verificada pelo Google</text>
  <text x="158" y="218" font-family="Arial, sans-serif" font-size="12" fill="#4ade80">Concluido</text>
  <!-- Warning -->
  <rect x="110" y="232" width="430" height="42" rx="8" fill="#2d2000"/>
  <circle cx="135" cy="253" r="13" fill="#f59e0b"/>
  <text x="135" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000">!</text>
  <text x="158" y="250" font-family="Arial, sans-serif" font-size="14" fill="#fef3c7">Categoria principal desatualizada</text>
  <text x="158" y="266" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24">Requer atencao</text>
  <!-- Error -->
  <rect x="110" y="280" width="430" height="42" rx="8" fill="#2d0d0d"/>
  <circle cx="135" cy="301" r="13" fill="#ef4444"/>
  <path d="M130 296 L140 306 M140 296 L130 306" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="158" y="298" font-family="Arial, sans-serif" font-size="14" fill="#fecaca">Nenhuma foto de servico adicionada</text>
  <text x="158" y="314" font-family="Arial, sans-serif" font-size="12" fill="#f87171">Critico - impacta ranqueamento</text>
  <!-- OK -->
  <rect x="110" y="328" width="430" height="42" rx="8" fill="#0d2d1a"/>
  <circle cx="135" cy="349" r="13" fill="#22c55e"/>
  <path d="M128 349 L133 355 L142 343" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="346" font-family="Arial, sans-serif" font-size="14" fill="#d1fae5">Horario de funcionamento configurado</text>
  <text x="158" y="362" font-family="Arial, sans-serif" font-size="12" fill="#4ade80">Concluido</text>
  <!-- Section 2 -->
  <text x="110" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9ab5d0" letter-spacing="2">SITE / SEO LOCAL</text>
  <line x1="110" y1="407" x2="540" y2="407" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Error -->
  <rect x="110" y="418" width="430" height="42" rx="8" fill="#2d0d0d"/>
  <circle cx="135" cy="439" r="13" fill="#ef4444"/>
  <path d="M130 434 L140 444 M140 434 L130 444" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="158" y="436" font-family="Arial, sans-serif" font-size="14" fill="#fecaca">Sem pagina de servico indexada no Google</text>
  <text x="158" y="452" font-family="Arial, sans-serif" font-size="12" fill="#f87171">Critico - zero visibilidade organica</text>
  <!-- Warning -->
  <rect x="110" y="466" width="430" height="42" rx="8" fill="#2d2000"/>
  <circle cx="135" cy="487" r="13" fill="#f59e0b"/>
  <text x="135" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000">!</text>
  <text x="158" y="484" font-family="Arial, sans-serif" font-size="14" fill="#fef3c7">Velocidade mobile abaixo do esperado</text>
  <text x="158" y="500" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24">Recomendado otimizar</text>
  <!-- OK -->
  <rect x="110" y="514" width="430" height="42" rx="8" fill="#0d2d1a"/>
  <circle cx="135" cy="535" r="13" fill="#22c55e"/>
  <path d="M128 535 L133 541 L142 529" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="532" font-family="Arial, sans-serif" font-size="14" fill="#d1fae5">Certificado SSL ativo (HTTPS)</text>
  <text x="158" y="548" font-family="Arial, sans-serif" font-size="12" fill="#4ade80">Concluido</text>
  <!-- Right panel -->
  <rect x="620" y="80" width="500" height="515" rx="20" fill="#131f33" stroke="#1e3a5f" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="620" y="80" width="500" height="56" rx="20" fill="#1a3050"/>
  <rect x="620" y="114" width="500" height="22" fill="#1a3050"/>
  <text x="870" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4a9eff">Resumo Executivo</text>
  <!-- Score donut -->
  <circle cx="870" cy="230" r="75" fill="none" stroke="#1e3a5f" stroke-width="14"/>
  <circle cx="870" cy="230" r="75" fill="none" stroke="#22c55e" stroke-width="14" stroke-dasharray="142 330" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 870 230)"/>
  <circle cx="870" cy="230" r="75" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="80 330" stroke-dashoffset="-142" stroke-linecap="round" transform="rotate(-90 870 230)"/>
  <circle cx="870" cy="230" r="75" fill="none" stroke="#ef4444" stroke-width="14" stroke-dasharray="110 330" stroke-dashoffset="-222" stroke-linecap="round" transform="rotate(-90 870 230)"/>
  <text x="870" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fff">48</text>
  <text x="870" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9ab5d0">de 100 pontos</text>
  <circle cx="710" cy="340" r="6" fill="#22c55e"/>
  <text x="724" y="345" font-family="Arial, sans-serif" font-size="13" fill="#9ab5d0">OK (3 itens)</text>
  <circle cx="810" cy="340" r="6" fill="#f59e0b"/>
  <text x="824" y="345" font-family="Arial, sans-serif" font-size="13" fill="#9ab5d0">Atencao (2)</text>
  <circle cx="930" cy="340" r="6" fill="#ef4444"/>
  <text x="944" y="345" font-family="Arial, sans-serif" font-size="13" fill="#9ab5d0">Critico (2)</text>
  <line x1="645" y1="362" x2="1095" y2="362" stroke="#1e3a5f" stroke-width="1"/>
  <text x="645" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a9eff">Proximos Passos Recomendados</text>
  <rect x="645" y="405" width="430" height="48" rx="10" fill="#1a2d47"/>
  <rect x="645" y="405" width="4" height="48" rx="2" fill="#ef4444"/>
  <text x="662" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fecaca">01. Adicionar fotos de servicos ao Google Meu Negocio</text>
  <text x="662" y="443" font-family="Arial, sans-serif" font-size="12" fill="#9ab5d0">Prioridade alta - impacto direto no mapa local</text>
  <rect x="645" y="461" width="430" height="48" rx="10" fill="#1a2d47"/>
  <rect x="645" y="461" width="4" height="48" rx="2" fill="#ef4444"/>
  <text x="662" y="481" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fecaca">02. Criar paginas de servico indexaveis no site</text>
  <text x="662" y="499" font-family="Arial, sans-serif" font-size="12" fill="#9ab5d0">Necessario para aparecer no Google alem do nome</text>
  <rect x="645" y="517" width="430" height="48" rx="10" fill="#1a2d47"/>
  <rect x="645" y="517" width="4" height="48" rx="2" fill="#f59e0b"/>
  <text x="662" y="537" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">03. Atualizar categoria e descricao do GMN</text>
  <text x="662" y="555" font-family="Arial, sans-serif" font-size="12" fill="#9ab5d0">Melhora relevancia nas buscas por categoria</text>
  <rect x="0" y="620" width="1200" height="55" fill="#0a1220" opacity="0.8"/>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9ab5d0">Relatorio entregue gratuitamente - com prioridades claras e recomendacoes acionaveis para cada ponto fraco encontrado.</text>
</svg>
